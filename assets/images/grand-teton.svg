<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="tetonTitle">
<title id="tetonTitle">Illustration of the jagged Teton range reflected in the still water of Oxbow Bend</title>
<defs>
  <linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1f3a2e"/>
    <stop offset="100%" stop-color="#e8c86a"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2d5240"/>
    <stop offset="100%" stop-color="#0f1f18"/>
  </linearGradient>
</defs>
<rect width="1200" height="800" fill="url(#tsky)"/>
<polygon points="300,120 380,300 250,300 420,60 620,320 480,320 700,140 900,320 760,320 980,110 1200,340 1200,420 0,420 0,340" fill="#0f1f18"/>
<polygon points="300,120 380,300 250,300 420,60 620,320 480,320 700,140 900,320 760,320 980,110 1200,340 1200,420 0,420 0,340" fill="#1e1b16" opacity="0.15"/>
<rect x="0" y="420" width="1200" height="380" fill="url(#water)"/>
<g opacity="0.35" transform="translate(0,420) scale(1,-1)">
  <polygon points="300,120 380,300 250,300 420,60 620,320 480,320 700,140 900,320 760,320 980,110 1200,340 1200,420 0,420 0,340" fill="#0f1f18"/>
</g>
<path d="M0 470 Q 300 450 600 480 T 1200 470" stroke="#e8c86a" stroke-width="3" fill="none" opacity="0.3"/>
<path d="M0 560 Q 300 540 600 570 T 1200 560" stroke="#e8c86a" stroke-width="2" fill="none" opacity="0.2"/>
<g transform="translate(150,600)" opacity="0.9">
  <rect x="0" y="20" width="140" height="70" fill="#3a2a1c"/>
  <polygon points="-10,20 70,-30 150,20" fill="#241a11"/>
  <rect x="55" y="55" width="30" height="35" fill="#0f1f18"/>
</g>
</svg>
